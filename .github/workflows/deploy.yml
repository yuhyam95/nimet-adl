name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail

            cd /root/nimet-adl

            git pull --ff-only origin production

            # Install from lockfiles so dependency failures stop the deployment.
            npm ci --omit=dev
            npm ci --prefix frontend

            # Express serves this Vite build from frontend/dist.
            npm run build --prefix frontend
            test -s frontend/dist/index.html

            # Restart only after the complete application is ready.
            pm2 restart nimet-adl-backend --update-env
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 2 --retry-connrefused \
              http://127.0.0.1:4000/api/health >/dev/null
